name: Publish aria2 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -eux
          docker build -t ghcr.io/${{ github.repository }}/aria2:3.20 docker/aria2
          docker push ghcr.io/${{ github.repository }}/aria2:3.20
