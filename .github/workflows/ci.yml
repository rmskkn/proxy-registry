name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build aria2 image
        run: docker build -t registry-proxy-aria2:local docker/aria2

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: CVE scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
